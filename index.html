function calcularGramosCombinado(gBase, n){
  const factor = 2 / (n + 1);
  const val = gBase * factor;
  return Math.max(1, Math.round(val * 10) / 10);
}
 
function generarCombinacion(itemsIncluidos){
  if(itemsIncluidos.length < 2) return null;
  const duros = itemsIncluidos.filter(i => i.planta.metodo === 'hervir');
  const delicados = itemsIncluidos.filter(i => i.planta.metodo === 'infusion');
  const n = itemsIncluidos.length;
 
  const ingredientes = itemsIncluidos.map(i => ({
    nombre: i.planta.nombre,
    gramos: calcularGramosCombinado(i.planta.g, n),
  }));
 
  let pasos = [];
  if(duros.length && delicados.length){
    const tiempoDuros = duros.map(d => d.planta.tiempo).sort().slice(-1)[0];
    pasos.push(`Hervir ${duros.map(d=>d.planta.nombre.toLowerCase()).join(', ')} en 1 litro de agua, ${tiempoDuros}.`);
    const necesitaTapar = delicados.some(d => d.planta.tapar);
    pasos.push(`Apagar el fuego. Agregar ${delicados.map(d=>d.planta.nombre.toLowerCase()).join(', ')}${necesitaTapar ? ', tapar' : ''} y dejar reposar 5-7 min más.`);
  } else if(duros.length){
    pasos.push(`Hervir todo junto en 1 litro de agua, 8-10 min.`);
  } else {
    const necesitaTapar = delicados.some(d => d.planta.tapar);
    pasos.push(`Agua caliente (90-100°C), agregar todo junto${necesitaTapar ? ', tapar' : ''} y dejar reposar 5-7 min.`);
  }
  pasos.push(`Colar y servir. Para 1 litro.`);
 
  const precauciones = new Set();
  itemsIncluidos.forEach(i => { i.advertencias.forEach(a => precauciones.add(a)); });
 
  return { ingredientes, pasos, precauciones: Array.from(precauciones) };
}

    ${leaf(24, 34, -18, 1.15, '#C9A227')}
    ${leaf(48, 22, 10, 0.9, '#6FA378')}
    ${leaf(68, 34, -8, 1.0, '#DCC066')}
    ${leaf(86, 20, 22, 0.75, '#8CBB8F')}
    ${leaf(56, 40, 30, 0.65, '#4F7856')}
  </svg>`;
}
 
function progressDots(active){
  let dots = '';
  for(let i=1;i<=3;i++) dots += `<div class="dot ${i<=active?'done':''}"></div>`;
  return `<div class="progress">${dots}</div>`;
}
 
function render(){
  if(state.step === 1) return renderStep1();
  if(state.step === 'bloqueo_bebe') return renderBloqueoBebe();
  if(state.step === 'alarma') return renderAlarma();
  if(state.step === 'no_reconocido') return renderNoReconocido();
  if(state.step === 'no_reconocido_neutro') return renderNoReconocidoNeutro();
  if(state.step === 2) return renderStep2();
  if(state.step === 3) return renderStep3();
}
 
function renderStep1(){
  root.innerHTML = `
    <div class="header">${leafSVG()}<h1>¿Qué te tomás?</h1><p class="sub">Contame qué te está pasando y te sugiero una infusión.</p></div>
    ${progressDots(1)}
    <div class="card">
      <h2>¿Qué te está pasando?</h2>
      <div class="field">
        <textarea id="sintoma-input" rows="3" placeholder="Ej: me duele la panza, no puedo dormir, tengo gripe..."></textarea>
        <small class="hint" id="error-vacio" style="display:none; color:#E7A98D;">Escribí algo antes de continuar.</small>
      </div>
      <button class="btn" id="btn-continuar">Continuar</button>
    </div>
  `;
  document.getElementById('btn-continuar').onclick = () => {
    const val = document.getElementById('sintoma-input').value.trim();
    if(!val){ document.getElementById('error-vacio').style.display = 'block'; return; }
    state.sintomaTexto = val;
    const textoLower = val.toLowerCase();
    if(PALABRAS_BEBE.some(p => textoLower.includes(p))){ state.step = 'bloqueo_bebe'; render(); return; }
    if(BANDERAS_ROJAS.some(p => textoLower.includes(p))){ state.step = 'alarma'; render(); return; }
    const match = SINTOMAS.find(s => s.keywords.some(k => textoLower.includes(k)));
    if(!match){
      const sueneMedico = PALABRAS_SINTOMA_GENERICO.some(p => textoLower.includes(p));
      state.step = sueneMedico ? 'no_reconocido' : 'no_reconocido_neutro';
      render();
      return;
    }
    state.categoria = match;
    state.step = 2;
    render();
  };
}
 
function renderBloqueoBebe(){
  root.innerHTML = `
    <div class="header">${leafSVG()}<h1>¿Qué te tomás?</h1></div>
    <div class="redirect-card">
      <h2>Esta app es para adultos</h2>
      <p>Para bebés y niños pequeños, las infusiones herbales pueden ser riesgosas incluso cuando parecen un remedio casero tradicional. Consultá directamente con un pediatra antes de darle cualquier infusión.</p>
    </div>
    <div class="footer-actions"><button class="btn secondary" id="btn-volver">Buscar otro síntoma</button></div>
  `;
  document.getElementById('btn-volver').onclick = resetApp;
}
 
function renderAlarma(){
  root.innerHTML = `
    <div class="header">${leafSVG()}<h1>¿Qué te tomás?</h1></div>
    <div class="redirect-card">
      <h2>Esto necesita ver a un profesional</h2>
      <p>Por lo que describís, no es algo para resolver con una infusión. Te recomendamos consultar a un profesional de la salud lo antes posible, en vez de automedicarte mientras tanto.</p>
    </div>
    <div class="footer-actions"><button class="btn secondary" id="btn-volver">Buscar otro síntoma</button></div>
  `;
  document.getElementById('btn-volver').onclick = resetApp;
}
 
function renderNoReconocidoNeutro(){
  root.innerHTML = `
    <div class="header">${leafSVG()}<h1>¿Qué te tomás?</h1></div>
    <div class="redirect-card">
      <h2>No tenemos algo para esto</h2>
      <p>Esto no es algo que podamos ayudarte a resolver con una infusión de nuestra base de datos. Probá describiendo un malestar físico puntual.</p>
    </div>
    <div class="footer-actions"><button class="btn secondary" id="btn-volver">Buscar otro síntoma</button></div>
  `;
  document.getElementById('btn-volver').onclick = resetApp;
}
 
function renderNoReconocido(){
  root.innerHTML = `
    <div class="header">${leafSVG()}<h1>¿Qué te tomás?</h1></div>
    <div class="redirect-card">
      <h2>No tenemos una sugerencia segura para esto</h2>
      <p>No encontramos una infusión con respaldo suficiente para lo que describís. Te recomendamos consultar a un profesional de la salud.</p>
    </div>
    <div class="footer-actions"><button class="btn secondary" id="btn-volver">Buscar otro síntoma</button></div>
  `;
  document.getElementById('btn-volver').onclick = resetApp;
}
 
function renderStep2(){
  root.innerHTML = `
    <div class="header">${leafSVG()}<h1>¿Qué te tomás?</h1></div>
    ${progressDots(2)}
    <div class="card">
      <h2>Antes de sugerirte algo</h2>
      <div class="question">
        <p>¿Estás embarazada?</p>
        <div class="yesno"><button data-val="si" data-q="embarazo">Sí</button><button data-val="no" data-q="embarazo">No</button></div>
      </div>
      <div class="question">
        <p>¿Tomás algún medicamento de forma regular?</p>
        <div class="yesno"><button data-val="si" data-q="medicacion">Sí</button><button data-val="no" data-q="medicacion">No</button></div>
      </div>
      <div class="field" id="medicacion-detalle-wrap" style="display:none;">
        <label>¿Cuál? (opcional)</label>
        <input type="text" id="medicacion-detalle" placeholder="Ej: anticoagulantes, para la presión...">
      </div>
      <button class="btn" id="btn-ver-resultado" disabled>Ver sugerencia</button>
    </div>
  `;
  const buttons = root.querySelectorAll('.yesno button');
  buttons.forEach(b => {
    b.onclick = () => {
      const q = b.dataset.q, val = b.dataset.val;
      state[q] = val;
      root.querySelectorAll(`[data-q="${q}"]`).forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      document.getElementById('medicacion-detalle-wrap').style.display = state.medicacion === 'si' ? 'block' : 'none';
      checkEnableContinue();
    };
  });
  function checkEnableContinue(){
    document.getElementById('btn-ver-resultado').disabled = !(state.embarazo !== null && state.medicacion !== null);
  }
  document.getElementById('btn-ver-resultado').onclick = () => {
    state.medicacionDetalle = document.getElementById('medicacion-detalle').value.trim();
    state.step = 3;
    render();
  };
}
 
function renderStep3(){
  const cat = state.categoria;
  const incluidas = [], excluidas = [];
 
  cat.plantas.forEach(p => {
    const planta = PLANTS[p.id];
    const prec = planta.precauciones;
    let excluida = false;
    let advertencias = [];
 
    if(state.embarazo === 'si' && prec.embarazo === 'excluir'){ excluida = true; }
    else if(state.embarazo === 'si' && prec.embarazo === 'advertencia'){
      advertencias.push('Precaución en embarazo — dosis de infusión ocasional suele tener menor riesgo, pero consultá con tu médico.');
    }
    if(!excluida && state.medicacion === 'si' && prec.medicacion) advertencias.push(prec.medicacion);
    if(prec.otra) advertencias.push(prec.otra);
 
    const item = { ...p, planta, advertencias };
    if(excluida) excluidas.push(item); else incluidas.push(item);
  });
 
  let html = `<div class="header">${leafSVG()}<h1>¿Qué te tomás?</h1></div>${progressDots(3)}`;
 
  if(cat.nota) html += `<div class="notice">${cat.nota}</div>`;
 
  if(cat.combosManual){
    html += `<p class="section-heading">Para "${cat.titulo.toLowerCase()}", estas recetas te pueden servir:</p>`;
    cat.combosManual.forEach(receta => {
      const advertencias = new Set();
      receta.componentes.forEach(c => {
        const planta = PLANTS[c.id];
        const prec = planta.precauciones;
        if(state.embarazo === 'si' && prec.embarazo === 'advertencia'){
          advertencias.add('Precaución en embarazo — dosis de infusión ocasional suele tener menor riesgo, pero consultá con tu médico.');
        }
        if(state.medicacion === 'si' && prec.medicacion) advertencias.add(prec.medicacion);
        if(prec.otra) advertencias.add(prec.otra);
      });
      html += `
        <div class="combo-card">
          <h3>${receta.nombre}</h3>
          <div class="combo-ingredientes">
            ${receta.componentes.map(c => `<span>${PLANTS[c.id].nombre} — ${c.gramos} g</span>`).join('')}
          </div>
          <div class="combo-pasos">
            ${receta.pasos.map(p => `<p>${p}</p>`).join('')}
            ${receta.notaExtra ? `<p><em>${receta.notaExtra}</em></p>` : ''}
          </div>
          ${advertencias.size ? `<div class="precaution">${Array.from(advertencias).join(' ')}</div>` : ''}
        </div>
      `;
    });
  } else if(incluidas.length === 0){
    html += `
      <div class="redirect-card">
        <h2>Nada seguro para tu situación puntual</h2>
        <p>Las opciones que normalmente sugerimos para esto no son recomendables según lo que marcaste. Te recomendamos consultar a un profesional de la salud.</p>
      </div>`;
  } else {
    const combo = generarCombinacion(incluidas);
    if(combo){
      html += `<p class="section-heading">Combinación armada para "${cat.titulo.toLowerCase()}"</p>`;
      html += `
        <div class="combo-card">
          <h3>Infusión combinada</h3>
          <p class="combo-sub">Cantidades ya calculadas para 1 litro de agua.</p>
          <div class="combo-ingredientes">
            ${combo.ingredientes.map(ing => `<span>${ing.nombre} — ${ing.gramos} g</span>`).join('')}
          </div>
          <div class="combo-pasos">${combo.pasos.map(p => `<p>${p}</p>`).join('')}</div>
          ${combo.precauciones.length ? `<div class="precaution">${combo.precauciones.join(' ')}</div>` : ''}
        </div>
      `;
    }
 
    html += `<p class="section-heading">O por separado, esto puede ayudarte:</p>`;
    incluidas.forEach(item => {
      html += `
        <div class="result-card">
          <h3>${item.planta.nombre}</h3>
          <p class="why">${item.motivo}</p>
          <div class="row"><span class="tag">Preparación</span><span>${item.planta.tempo}, ${item.planta.tiempo}, ${item.planta.g} g/litro. En frío: ${item.planta.frio}.</span></div>
          ${item.advertencias.length ? `<div class="precaution">${item.advertencias.join(' ')}</div>` : ''}
        </div>
      `;
    });
  }
 
  if(excluidas.length){
    html += `<p class="section-heading">Normalmente también ayudaría, pero no te lo sugerimos:</p>`;
    excluidas.forEach(item => {
      const motivo = state.embarazo === 'si' ? 'Contraindicado en embarazo.' : '';
      html += `<div class="excluded-card"><h4>${item.planta.nombre}</h4><p>${motivo} ${item.planta.precauciones.otra || ''}</p></div>`;
    });
  }
 
  html += `<div class="footer-actions"><button class="btn secondary" id="btn-otro">Buscar otro síntoma</button></div>`;
 
  root.innerHTML = html;
  document.getElementById('btn-otro').onclick = resetApp;
}
 
function resetApp(){
  state = { step:1, sintomaTexto:"", categoria:null, embarazo:null, medicacion:null, medicacionDetalle:"" };
  render();
}
 
render();
 
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
